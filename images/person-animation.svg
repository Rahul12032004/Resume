<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874.36 880.5">
  <defs>
    <style>
      .cls-1 {
        fill: #d6d6e3;
      }

      .cls-2 {
        fill: #090814;
      }

      .cls-3 {
        fill: #3f3d56;
      }

      .cls-4 {
        fill: #444053;
      }

      .cls-5 {
        isolation: isolate;
        opacity: .1;
      }

      .cls-6 {
        fill: #ed9da0;
      }

      .cls-7 {
        fill: #6c63ff;
      }

      .cls-8 {
        fill: #e6e6e6;
      }

      #compass_head {
        transform-box: fill-box;
        transform-origin: 50% 15%;
        animation: compass-sway 3s ease-in-out infinite alternate;
      }
      #person_hand {
        transform-box: fill-box;
        transform-origin: 10% 50%;
        animation: hand-move 2s ease-in-out infinite alternate;
      }
      #left_oval_ring, #small_circle {
        transform-box: fill-box;
        transform-origin: center;
        animation: ring-pulse 2.4s ease-in-out infinite;
      }
      @keyframes compass-sway {
        from { transform: rotate(-3deg); }
        to { transform: rotate(3deg); }
      }
      @keyframes hand-move {
        from { transform: rotate(-5deg); }
        to { transform: rotate(5deg); }
      }
      @keyframes ring-pulse {
        0%, 100% { opacity: .5; transform: scale(.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        #compass_head, #person_face, #person_hair, #person_hand, #left_oval_ring, #small_circle {
          animation: none;
        }
      }
    </style>
  </defs>
